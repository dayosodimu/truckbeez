# TruckBeez mobile E2E: Appium 2 + WebdriverIO (BR-13, docs/qa/test-plan.md)
#
#   pull_request (e2e/mobile/**):  typecheck + unit tests of the E2E helpers   -> blocking
#   nightly + workflow_dispatch:   build the Android app, boot an emulator, run @smoke
#
# The emulator job is NON-BLOCKING for now (continue-on-error) because the app does not
# expose testIDs yet (test plan Appendix A). Set the repository variable
# E2E_MOBILE_BLOCKING=true once the smoke run is stable to make failures fail the run.

name: e2e-mobile

on:
  pull_request:
    paths: ["e2e/mobile/**", ".github/workflows/e2e-mobile.yml"]
  schedule:
    - cron: "17 6 * * *" # nightly, ~01:17 New York
  workflow_dispatch:
    inputs:
      app_ref:
        description: "Branch, tag or SHA to build apps/mobile from (e.g. feat/BR-38-starter-app-and-fleet)"
        required: false
        default: ""
      grep:
        description: "Mocha grep: which tagged tests to run"
        required: false
        default: "@smoke"
      api_level:
        description: "Android emulator API level"
        required: false
        default: "34"

permissions:
  contents: read

concurrency:
  group: e2e-mobile-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: E2E helpers (typecheck + unit)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: e2e/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No lockfile yet: npm registry access is needed to generate it. Switch to `npm ci` once committed.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test:unit

  android-smoke:
    name: Android emulator (${{ inputs.grep || '@smoke' }})
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    # Non-blocking until the app has testIDs (see header).
    continue-on-error: ${{ vars.E2E_MOBILE_BLOCKING != 'true' }}
    env:
      APP_REF: ${{ inputs.app_ref }}
      GREP: ${{ inputs.grep || '@smoke' }}
      API_LEVEL: ${{ inputs.api_level || '34' }}
      # The build under test talks to staging. Only the URL; the app never holds API keys (docs/secrets.md).
      EXPO_PUBLIC_API_URL: ${{ vars.STAGING_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check out the app source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.app_ref || github.sha }}
          path: app-src

      - name: Is there an app to test?
        id: app
        run: |
          if [ -f app-src/apps/mobile/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            msg="apps/mobile is not on ref '${APP_REF:-$GITHUB_REF_NAME}' yet. Run this workflow with app_ref=feat/BR-38-starter-app-and-fleet, or wait for BR-38 to merge."
            echo "::warning title=e2e-mobile skipped::$msg"
            echo "### e2e-mobile skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        if: steps.app.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: 17

      - name: Build release APK (expo prebuild + gradle)
        if: steps.app.outputs.present == 'true'
        working-directory: app-src/apps/mobile
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::warning::Repository variable STAGING_API_URL is not set; the app will use its default API URL."
          fi
          npm install --no-audit --no-fund
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease --no-daemon --console=plain
          APK="$(ls "$PWD"/app/build/outputs/apk/release/*.apk | head -n1)"
          echo "ANDROID_APP=$APK" >> "$GITHUB_ENV"
          echo "Built $APK"

      - name: Install E2E dependencies and Appium driver
        if: steps.app.outputs.present == 'true'
        working-directory: e2e/mobile
        run: |
          npm install --no-audit --no-fund
          npm run drivers:android

      - name: Enable KVM
        if: steps.app.outputs.present == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Appium tests on the emulator
        if: steps.app.outputs.present == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd e2e/mobile && npx wdio run ./wdio.android.conf.ts --mochaOpts.grep "$GREP"

      - name: Upload reports (Allure, JUnit, Appium log)
        if: always() && steps.app.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-mobile-android-api${{ env.API_LEVEL }}
          path: e2e/mobile/reports
          if-no-files-found: warn
          retention-days: 14
