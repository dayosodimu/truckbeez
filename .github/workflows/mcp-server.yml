name: mcp-server

on:
  push:
    branches: [main]
    paths: ['tools/mcp-server/**', '.github/workflows/mcp-server.yml']
  pull_request:
    paths: ['tools/mcp-server/**', '.github/workflows/mcp-server.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: MCP server tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tools/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python tests/test_server.py
