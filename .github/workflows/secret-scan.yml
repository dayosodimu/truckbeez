name: secret-scan

# Blocks merges that add secrets: real keys, hard-coded mock keys, secret-named public
# (EXPO_PUBLIC_*) variables, or committed env/key files. See docs/secrets.md.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly full-history scan, Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just this commit

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Scanner self-test
        run: node --test scripts/check-secrets.test.mjs

      - name: TruckBeez rules (mock keys, public env vars, env files)
        run: node scripts/check-secrets.mjs

      - name: gitleaks (provider rules, full git history)
        run: |
          docker run --rm -v "$PWD:/repo" --entrypoint sh ghcr.io/gitleaks/gitleaks:v8.18.4 -c \
            'git config --global --add safe.directory /repo && \
             gitleaks detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner -v'
