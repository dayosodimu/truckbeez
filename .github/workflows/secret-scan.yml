name: secret-scan

# Blocks merges that add secrets: real keys, hard-coded mock keys, secret-named public
# (EXPO_PUBLIC_*) variables, or committed env/key files. See docs/secrets.md.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # weekly full-history scan, Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Actions are pinned by commit SHA (BR-52 M5); Dependabot bumps them (.github/dependabot.yml).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just this commit
          persist-credentials: false # keep GITHUB_TOKEN out of .git/config, which is mounted into gitleaks

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Scanner self-test
        run: node --test scripts/check-secrets.test.mjs

      - name: TruckBeez rules (mock keys, public env vars, env files)
        run: node scripts/check-secrets.mjs

      # The third-party image gets no network, no token and a read-only repo, so a bad image
      # can at worst report a false pass; it can't exfiltrate or change anything.
      # TODO(BR-52 M5): replace the tag with its digest (ghcr.io/gitleaks/gitleaks@sha256:...).
      - name: gitleaks (provider rules, full git history)
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1
        run: |
          docker run --rm --network none --read-only --tmpfs /tmp -e HOME=/tmp \
            -v "$PWD:/repo:ro" --entrypoint sh "$GITLEAKS_IMAGE" -c \
            'git config --global --add safe.directory /repo && \
             gitleaks detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner -v'
