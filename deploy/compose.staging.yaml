# STAGING — first deployed environment. Prod-like config, seeded test data,
# Stripe test mode. Auto-deployed on every merge to main.
#
#   docker compose -p truckbeez-staging \
#     -f deploy/compose.base.yaml -f deploy/compose.data.yaml -f deploy/compose.staging.yaml up -d --wait

name: truckbeez-staging

services:
  api:
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped
    environment:
      APP_ENV: staging
      LOG_LEVEL: debug
